name: list
description: "Loan Managenet app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive_flutter: ^1.1.0
  get: ^4.7.2
  pdf: ^3.10.7
  path_provider: ^2.1.2
  open_file: ^3.3.2
  permission_handler: ^11.3.0
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  nepali_utils: ^3.0.8
  nepali_date_picker: ^6.0.2
  file_selector: ^0.9.3+3

dev_dependencies:
  build_runner: ^2.5.4
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash:

  flutter_test:
    sdk: flutter
flutter_icons:
  android: true
  ios: true
  windows: true
  image_path: "assets/icon.png"

  flutter_lints: ^5.0.0
flutter_native_splash:
  color: "#e28743"
  image: "assets/icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/
